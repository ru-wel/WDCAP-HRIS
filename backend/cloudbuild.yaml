steps:
  # Step 1: Pull the latest image to use as a cache layer
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-backend:latest || exit 0']

  # Step 2: Build the image using the cache
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-backend:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-backend:latest'
      - '--cache-from'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-backend:latest'
      - '.'
    dir: 'backend'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'hris-backend'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-backend:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'

# The 'images' field automatically pushes these tags to Artifact Registry
images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-backend:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-backend:latest'

# based on Artifact Registry setup
substitutions:
  _REGION: asia-east2        
  _REPO_NAME: arise-hris

# Build configuration 
timeout: '1200s'  # 20 minutes max
options:
  logging: CLOUD_LOGGING_ONLY