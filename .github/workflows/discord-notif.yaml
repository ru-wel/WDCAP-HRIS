name: Cloud Build Notifications

on:
  check_run:
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >-
      (contains(github.event.check_run.name, 'arise-hris-frontend') || 
       contains(github.event.check_run.name, 'arise-hris-backend')) &&
      github.event.check_run.app.slug == 'google-cloud-build'
    
    steps:
      - name: Fetch Commit Details
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Get the SHA from the check run
          SHA=${{ github.event.check_run.head_sha }}
          
          # 2. Create a short version (first 7 chars)
          echo "short_sha=${SHA::7}" >> $GITHUB_OUTPUT
          
          # 3. Use GitHub CLI to fetch the commit info
          # We prefer 'commit.author.name' over 'login' to get the real name
          DATA=$(gh api repos/${{ github.repository }}/commits/$SHA)
          
          AUTHOR=$(echo "$DATA" | jq -r '.commit.author.name')
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          
          # 4. Get the message (limit to first line to avoid giant notifications)
          MESSAGE=$(echo "$DATA" | jq -r '.commit.message' | head -n 1)
          echo "message=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Discord Notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            **Build Update:** ${{ github.event.check_run.name }}
            **Status:** ${{ github.event.check_run.conclusion }} ${{ github.event.check_run.conclusion == 'success' && '✅' || '❌' }}
            
            👤 **Author:** ${{ steps.commit.outputs.author }}
            📝 **Commit:** `${{ steps.commit.outputs.short_sha }}`
            💬 **Message:** ${{ steps.commit.outputs.message }}
            
            [View Build Details](${{ github.event.check_run.html_url }})