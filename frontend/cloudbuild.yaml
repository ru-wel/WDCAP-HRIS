steps:
  # Step 1: Pull the latest image to use as a cache layer
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-frontend:latest || exit 0']

  # Step 2: Build the image using the cache (includes Vite build inside)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-frontend:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-frontend:latest'
      - '--cache-from'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-frontend:latest'
      - '.'
    dir: 'frontend'

# The 'images' field automatically pushes these tags to Artifact Registry
images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-frontend:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/hris-frontend:latest'

# based on Artifact Registry setup
substitutions:
  _REGION: asia-east2        
  _REPO_NAME: arise-hris

# Build configuration
timeout: '1800s'  # 30 minutes (frontend builds take longer due to Vite build)
options:
  machineType: 'E2_HIGHCPU_8'  # Use faster build machine (8 cores)
  logging: CLOUD_LOGGING_ONLY
